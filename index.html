<style>
:root{
  color-scheme:light;
  --bg:#F6EEE9;--surface:#FFFAF7;--sunk:#F2E6E0;--nude:#EEE1D2;--rose:#E2A9AD;--rose-soft:#F5DEDC;
  --champ:#C4907A;--champ-soft:#F6E7DF;--ink:#3B1E25;--muted:#86706F;--line:#ECDDD5;
  --accent:#7A1B30;--on-ink:#FFF8F3;--on-accent:#FFF8F3;--pink:#E4ADB1;--on-pink:#3B0712;--wine:#3A0611;--on-wine:#F4E7E0;
  --green:#4F6F3A;--green-soft:#E6EDDC;--red:#A63A3A;--red-soft:#F7E0DD;--amber:#8C6420;--amber-soft:#F6EAD0;
  --shadow:0 2px 10px -6px rgba(74,29,39,.28);
  --display:"Jost","Futura","Avenir Next",system-ui,sans-serif;
  --serif:"Cormorant Garamond","Didot",Georgia,serif;
  --body:"Jost","Futura","Avenir Next",system-ui,-apple-system,"Segoe UI",sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
  --bg:#1A1113;--surface:#24171B;--sunk:#2E1E23;--nude:#3A2B27;--rose:#C98A92;--rose-soft:#3F232A;
  --champ:#DFAF9B;--champ-soft:#36241E;--ink:#F4E7E1;--muted:#B79F9F;--line:#3A272D;
  --accent:#E7A2B0;--on-ink:#1A1113;--on-accent:#24171B;--pink:#C98A92;--on-pink:#1F1014;--wine:#2A040C;--on-wine:#F4E7E0;
  --green:#9CC389;--green-soft:#23321E;--red:#EE9A90;--red-soft:#43211F;--amber:#E2C07A;--amber-soft:#382D19;--shadow:none}}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#1A1113;--surface:#24171B;--sunk:#2E1E23;--nude:#3A2B27;--rose:#C98A92;--rose-soft:#3F232A;
  --champ:#DFAF9B;--champ-soft:#36241E;--ink:#F4E7E1;--muted:#B79F9F;--line:#3A272D;
  --accent:#E7A2B0;--on-ink:#1A1113;--on-accent:#24171B;--pink:#C98A92;--on-pink:#1F1014;--wine:#2A040C;--on-wine:#F4E7E0;
  --green:#9CC389;--green-soft:#23321E;--red:#EE9A90;--red-soft:#43211F;--amber:#E2C07A;--amber-soft:#382D19;--shadow:none}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:400 15.5px/1.5 var(--body);font-variant-numeric:tabular-nums lining-nums;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font-family:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{flex:none}
.app{display:flex;min-height:100%}
.col{flex:1;min-width:0}

/* Top bar (mobile) */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;background:var(--bg);border-bottom:1px solid var(--line)}
.brand{font-family:var(--display);font-size:21px;line-height:1.05;font-weight:400;letter-spacing:.005em;min-width:0}
.brand em{display:block;font-style:italic;font-size:13px;color:var(--muted);margin-top:2px}
.top-actions{display:flex;gap:6px}
main{max-width:760px;margin:0 auto;padding:20px 16px 110px}

/* Bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
.nav button{appearance:none;border:0;background:none;color:var(--muted);font:500 10.5px/1.2 var(--body);display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0;cursor:pointer;min-width:0}
.nav .ico{display:grid;place-items:center;width:50px;height:30px;border-radius:999px;transition:background .15s}
.nav svg{width:21px;height:21px}
.nav button[aria-current="page"]{color:var(--ink)}
.nav button[aria-current="page"] .ico{background:var(--nude)}
.fab{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:31;width:54px;height:54px;border-radius:50%;border:0;background:var(--ink);color:var(--on-ink);display:grid;place-items:center;cursor:pointer;box-shadow:0 8px 22px -8px rgba(43,37,34,.5)}
.fab svg{width:24px;height:24px}

/* Desktop rail */
.rail{display:none}
@media (min-width:960px){
  .rail{display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;width:248px;flex:none;padding:28px 18px;border-right:1px solid var(--line);background:var(--surface);overflow:auto}
  .rail .brand{font-size:24px;margin:0 8px 22px}
  .rail .rq{display:flex;flex-direction:column;gap:6px;margin-bottom:22px}
  .rail .rq .btn{justify-content:flex-start}
  .rail a,.rail .rl{appearance:none;border:0;background:none;display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;color:var(--muted);font:500 15px/1 var(--body);cursor:pointer;text-align:left}
  .rail .rl svg{width:20px;height:20px}
  .rail .rl[aria-current="page"]{background:var(--nude);color:var(--ink)}
  .nav,.fab{display:none}
  main{padding:34px 32px 60px}
}

/* Type */
.kicker{margin:0;color:var(--muted);font-weight:500;font-size:14px}
.title{font-family:var(--display);font-weight:400;font-size:34px;line-height:1.08;margin:2px 0 18px;letter-spacing:-.005em}
h2{font-family:var(--display);font-weight:400;font-size:22px;line-height:1.2;margin:0}
h3{margin:0}
.hint{font-size:13.5px;color:var(--muted);margin:2px 0 14px}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:30px 0 12px}
.view-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px}
.view-head .title{margin:0}

/* Buttons */
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:500 14.5px/1.1 var(--body);padding:12px 16px;border-radius:12px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;text-decoration:none;text-align:center;transition:transform .08s,background .15s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent);padding-left:8px;padding-right:8px}
.btn.soft{background:var(--nude);border-color:var(--nude)}
.btn.danger{color:var(--red);border-color:var(--red-soft)}
.btn.danger-solid{background:var(--red);border-color:var(--red);color:#fff}
.btn.sm{min-height:36px;padding:8px 12px;font-size:13.5px;border-radius:10px}
.btn.block{width:100%}
.btn svg{width:18px;height:18px}
.iconbtn{appearance:none;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn svg{width:20px;height:20px}
.iconbtn.sm{width:34px;height:34px;border-radius:10px}
.iconbtn.sm svg{width:16px;height:16px}
.iconbtn[aria-current="page"]{background:var(--nude);border-color:var(--nude)}
.back{appearance:none;border:0;background:none;color:var(--accent);font:500 15px/1 var(--body);display:inline-flex;align-items:center;gap:4px;padding:8px 0;margin-bottom:6px;cursor:pointer}
.back svg{width:18px;height:18px}
.linkbtn{appearance:none;border:0;background:none;color:var(--accent);font:500 14px/1.3 var(--body);padding:8px 0;cursor:pointer;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}

/* Swatch */
.sw{--c:#C4AA80;display:inline-block;width:13px;height:13px;border-radius:50%;background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.75) 0 10%,rgba(255,255,255,0) 34%),var(--c);box-shadow:inset 0 -2px 3px rgba(0,0,0,.16),0 0 0 1px rgba(0,0,0,.07);flex:none;vertical-align:-2px}
.sw.lg{width:22px;height:22px}
.sws{display:inline-flex;align-items:center}
.sws .sw+.sw{margin-left:-4px;box-shadow:inset 0 -2px 3px rgba(0,0,0,.16),0 0 0 2px var(--surface)}

/* Home hero */
.hero{background:var(--nude);border-radius:26px;padding:20px 22px 18px;position:relative}
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.hero-top>span{font-size:14px;font-weight:500;color:var(--muted)}
.pills{display:inline-flex;background:var(--surface);border-radius:999px;padding:3px;gap:2px}
.pills button{appearance:none;border:0;background:none;padding:6px 11px;border-radius:999px;font:500 12.5px/1 var(--body);color:var(--muted);cursor:pointer}
.pills button[aria-pressed="true"]{background:var(--ink);color:var(--on-ink)}
.hero-num{display:block;font-family:var(--display);font-weight:400;font-size:50px;line-height:1.05;margin:12px 0 16px;letter-spacing:-.01em;overflow-wrap:anywhere}
.hero-split{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid color-mix(in srgb,var(--ink) 14%,transparent);padding-top:12px;gap:12px}
.hero-split span{display:block;font-size:12.5px;color:var(--muted)}
.hero-split b{font-weight:600;font-size:17px}
.hero-split small{display:block;font-size:12px;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.kpis>div{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 12px 10px;min-width:0}
.kpis b{display:block;font-family:var(--display);font-weight:400;font-size:24px;line-height:1.15}
.kpis b.m{font-size:18px;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpis span{font-size:12.5px;color:var(--muted)}
.quick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.quick .btn{flex-direction:column;gap:6px;padding:14px 6px;min-height:76px;font-size:13.5px;border-radius:16px}
.quick .btn svg{width:22px;height:22px;color:var(--accent)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.alert{display:flex;gap:12px;align-items:flex-start;background:var(--champ-soft);border:1px solid color-mix(in srgb,var(--champ) 45%,transparent);border-radius:16px;padding:14px 16px;margin-top:10px}
.alert>svg{width:20px;height:20px;color:var(--amber);margin-top:2px}
.alert p{margin:2px 0 10px;font-size:14px;color:var(--muted)}
.alert b{font-weight:600}
.alert .row{display:flex;gap:8px;flex-wrap:wrap}
.list{display:flex;flex-direction:column;gap:8px}
.empty{border:1.5px dashed var(--line);border-radius:16px;padding:24px 18px;text-align:center;color:var(--muted)}
.empty p{margin:0 0 12px}
.empty-s{color:var(--muted);text-align:center;padding:14px;font-size:14px;margin:0}

/* Appointments */
.appt{display:grid;grid-template-columns:52px minmax(0,1fr);gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px}
.appt-time b{display:block;font-size:17px;font-weight:600;line-height:1.2}
.appt-time small{color:var(--muted);font-size:12px;display:block}
.appt-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.cname{appearance:none;border:0;background:none;padding:0;font:600 16px/1.25 var(--body);color:var(--ink);text-align:left;cursor:pointer}
.svc-line{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.svc-tag{display:inline-flex;align-items:center;gap:6px;font-size:13px;background:var(--sunk);padding:4px 10px 4px 5px;border-radius:999px}
.meta{display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:13px;color:var(--muted)}
.idtag{display:inline-block;font-size:12px;font-weight:600;color:var(--accent);background:var(--rose-soft);padding:1px 8px;border-radius:6px;letter-spacing:.02em;white-space:nowrap}
.actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.appt.cancelada,.appt.noasistio{opacity:.6}
.chip{font-size:12px;font-weight:500;padding:3px 10px;border-radius:999px;white-space:nowrap}
.st-pend{background:var(--amber-soft);color:var(--amber)}
.st-conf{background:var(--rose-soft);color:var(--accent)}
.st-done{background:var(--green-soft);color:var(--green)}
.st-cancel{background:var(--sunk);color:var(--muted)}
.gap{appearance:none;width:100%;display:flex;align-items:center;gap:10px;border:1px dashed var(--line);background:none;border-radius:14px;padding:10px 14px;color:var(--muted);font:500 13.5px/1.2 var(--body);cursor:pointer;text-align:left}
.gap svg{width:16px;height:16px}
.gap b{color:var(--ink);font-weight:500}

/* Week */
.week{display:grid;grid-template-columns:26px repeat(7,minmax(0,1fr)) 26px;gap:4px;margin-bottom:4px}
.arrow{appearance:none;border:0;background:none;color:var(--muted);cursor:pointer;border-radius:10px;display:grid;place-items:center;padding:0}
.arrow svg{width:20px;height:20px}
.day{appearance:none;border:1px solid transparent;background:var(--surface);border-radius:14px;padding:8px 0 5px;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer;color:var(--ink);min-width:0}
.day span{font-size:11px;color:var(--muted);text-transform:capitalize}
.day b{font-size:17px;font-weight:600;line-height:1.2}
.day i{font-style:normal;font-size:10px;font-weight:600;min-height:14px;color:var(--accent)}
.day.today{border-color:var(--champ)}
.day.sel{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.day.sel span,.day.sel i{color:inherit;opacity:.85}
.day-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:18px 0 12px}

/* Rows */
.row-btn{appearance:none;width:100%;display:grid;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;text-align:left;color:var(--ink);font:inherit;cursor:pointer}
.r3{grid-template-columns:auto minmax(0,1fr) auto}
.r2{grid-template-columns:minmax(0,1fr) auto}
.avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--nude);color:var(--ink);font-weight:500;font-size:14px;flex:none;letter-spacing:.02em}
.avatar.lg{width:64px;height:64px;font-size:21px;font-family:var(--display)}
.minfo{min-width:0}
.rtitle{display:block;font-weight:500;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rsub{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted);margin-top:3px;min-width:0}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.ramt{text-align:right;font-weight:600;white-space:nowrap}
.ramt small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.mtime{font-size:13px;color:var(--muted);font-weight:500;min-width:40px}
.mico{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--sunk);color:var(--muted)}
.mico svg{width:17px;height:17px}
.mico.in{background:var(--green-soft);color:var(--green)}
.mico.fee{background:var(--rose-soft);color:var(--accent)}
.dgroup{display:flex;justify-content:space-between;font-size:13px;font-weight:500;color:var(--muted);margin:18px 2px 8px}
.pos-t{color:var(--green)} .neg-t{color:var(--red)}
.search{position:relative;margin-bottom:10px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted);pointer-events:none}
.search input{padding-left:38px}

/* Segments / chips */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--sunk);padding:4px;border-radius:12px;gap:4px;margin-bottom:14px}
.seg button{appearance:none;border:0;background:none;padding:9px 6px;border-radius:9px;font:500 14px/1 var(--body);color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{appearance:none;flex:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:999px;font:500 13.5px/1 var(--body);cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.pnav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.pnav b{font-family:var(--display);font-weight:400;font-size:20px;text-align:center}
.strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:6px}
.strip>div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;min-width:0}
.strip span{display:block;font-size:12px;color:var(--muted)}
.strip b{font-weight:600;font-size:14.5px;overflow-wrap:anywhere}

/* Reports */
.ledger-card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:20px}
.ledger-card .lbl{font-size:14px;font-weight:500;color:var(--muted)}
.big{font-family:var(--display);font-size:44px;line-height:1.08;display:block;margin:4px 0 6px;overflow-wrap:anywhere;font-weight:400}
.delta{display:inline-block;font-size:12.5px;font-weight:500;padding:2px 9px;border-radius:999px;background:var(--sunk);color:var(--muted);margin-bottom:12px}
.delta.up{background:var(--green-soft);color:var(--green)}
.delta.down{background:var(--red-soft);color:var(--red)}
.ledger{margin:0}
.ledger div{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:15px}
.ledger dt{color:var(--muted)}
.ledger dd{margin:0;font-weight:500;white-space:nowrap}
.ledger .sub dt,.ledger .sub dd{color:var(--ink);font-weight:600}
.ledger .tot{border-top:1.5px solid var(--ink)}
.ledger .tot dt{color:var(--ink);font-weight:600}
.ledger .tot dd{font-weight:700}
.foot-note{font-size:13px;color:var(--muted);margin:10px 0 0}
.counters{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}
@media (min-width:560px){.counters{grid-template-columns:repeat(3,minmax(0,1fr))}}
.counter{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;min-width:0}
.counter b{display:block;font-family:var(--display);font-weight:400;font-size:24px;line-height:1.2;overflow-wrap:anywhere}
.counter span{font-size:13px;color:var(--muted)}
.bars{display:flex;flex-direction:column;gap:6px}
.brow{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:10px 12px 11px;border-radius:12px;background:var(--surface);border:1px solid var(--line);overflow:hidden;font-size:14px}
.brow i{position:absolute;left:0;bottom:0;height:3px;width:var(--w);background:var(--champ)}
.brow.acc i{background:var(--accent)}
.bname{display:flex;align-items:center;gap:8px;min-width:0}
.bname span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bq{color:var(--muted);font-size:13px;white-space:nowrap}
.bamt{font-weight:600;white-space:nowrap}
.chart{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 12px 10px;margin-top:10px}
.chart svg{width:100%;max-width:560px;height:auto;display:block;margin:0 auto}
.b-in{fill:var(--ink)} .b-ex{fill:var(--champ)} .c-line{fill:none;stroke:var(--accent);stroke-width:1.6}
.c-lbl{fill:var(--muted);font-size:9px;font-family:var(--body)}
.c-axis{stroke:var(--line);stroke-width:1}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.split-bar{display:flex;height:10px;border-radius:999px;overflow:hidden;background:var(--sunk);margin:10px 0 8px}
.split-bar span{display:block;height:100%}

/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(28,22,20,.46);z-index:50;display:flex;align-items:flex-end;justify-content:center;opacity:0;transition:opacity .18s ease}
.scrim.open{opacity:1}
.sheet{background:var(--surface);width:100%;max-width:620px;max-height:93%;border-radius:26px 26px 0 0;display:flex;flex-direction:column;transform:translateY(28px);transition:transform .24s cubic-bezier(.2,.8,.2,1);padding-bottom:env(safe-area-inset-bottom,0px)}
.scrim.open .sheet{transform:none}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px 10px}
.sheet-body{overflow:auto;padding:4px 18px 18px;overscroll-behavior:contain}
.sheet-foot{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}
.sheet-foot .btn{flex:none}
.sheet-foot .btn.block{flex:1;width:auto}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:26px;max-height:88%}}
.scrim.center{align-items:center;z-index:60}
.dialog{background:var(--surface);border-radius:22px;padding:22px;max-width:380px;width:calc(100% - 32px)}
.dialog h3{font-family:var(--display);font-weight:400;font-size:22px;margin-bottom:6px}
.dialog p{margin:0 0 18px;color:var(--muted);font-size:14.5px}
.dlg-actions{display:flex;gap:8px;justify-content:flex-end}
.qa-list{display:flex;flex-direction:column;gap:8px}
.qa{appearance:none;display:flex;align-items:center;gap:14px;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:14px;color:var(--ink);cursor:pointer;text-align:left;font:inherit}
.qa svg{width:22px;height:22px;color:var(--accent)}
.qa b{display:block;font-weight:500}
.qa small{color:var(--muted);font-size:13px}

/* Forms */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;min-width:0}
.field>label,.lbl{font-size:13px;font-weight:500;color:var(--muted)}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:44px;width:100%;min-width:0}
textarea{resize:vertical;min-height:64px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ink);outline-offset:0;border-color:transparent}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.cp-list{display:flex;flex-direction:column;gap:6px}
.cp-item{appearance:none;display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 10px;color:var(--ink);cursor:pointer;text-align:left;font:inherit}
.cp-item .avatar{width:32px;height:32px;font-size:12px}
.cp-item svg{width:20px;height:20px}
.cp-item.new{border-style:dashed;color:var(--accent);font-weight:500}
.cp-sel{display:flex;align-items:center;gap:12px;background:var(--sunk);border-radius:14px;padding:10px 12px}
.cp-sel b{display:block;font-weight:500}
.cp-sel small{color:var(--muted);font-size:13px}
.cp-new{background:var(--sunk);border-radius:14px;padding:12px 12px 2px}
.qgroup{font-size:12.5px;font-weight:500;color:var(--muted);margin:12px 0 6px}
.svc-pick{display:flex;flex-wrap:wrap;gap:8px}
.svc-chip{appearance:none;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 12px 9px 9px;border-radius:999px;font:400 14px/1.2 var(--body);cursor:pointer;text-align:left}
.svc-chip small{color:var(--muted)}
.svc-chip[aria-pressed="true"]{border-color:var(--ink);background:var(--nude);font-weight:500}
.slots{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.slots::-webkit-scrollbar{display:none}
.slots button{appearance:none;flex:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 12px;border-radius:10px;font:500 14px/1 var(--body);cursor:pointer}
.slots button[aria-pressed="true"]{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.warn{display:flex;gap:10px;align-items:flex-start;background:var(--red-soft);color:var(--red);border-radius:12px;padding:10px 12px;font-size:14px;margin:0 0 14px}
.warn svg{width:18px;height:18px;margin-top:1px}
.qrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:9px 10px 9px 12px;border:1px solid var(--line);border-radius:14px;margin-bottom:6px}
.qrow.on{border-color:var(--ink);background:var(--nude)}
.qname b{display:block;font-weight:500;font-size:15px;line-height:1.25}
.qname small{color:var(--muted);font-size:13px}
.pline{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:13px;color:var(--muted)}
.pline input{min-height:36px;padding:6px 10px;max-width:120px;background:var(--surface)}
.qrow.custom{grid-template-columns:minmax(0,1fr) auto}
.qrow.custom input.cin{min-height:38px;padding:7px 10px;background:var(--surface)}
.stepper{display:flex;align-items:center;gap:4px}
.stepper button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:20px;line-height:1;cursor:pointer}
.stepper button:disabled{opacity:.35;cursor:default}
.stepper output{min-width:22px;text-align:center;font-weight:600}
.mchips{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.mchip{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 4px;border-radius:12px;font:500 13.5px/1.15 var(--body);cursor:pointer;text-align:center;min-width:0}
.mchip small{display:block;font-weight:400;font-size:11px;color:var(--muted);margin-top:2px}
.mchip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--on-ink)}
.mchip[aria-pressed="true"] small{color:inherit;opacity:.8}
.prow{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) auto;gap:8px;align-items:center;margin-bottom:8px}
.prow output{display:flex;align-items:center;min-height:44px;padding:0 12px;border-radius:12px;background:var(--sunk);font-weight:600}
.prow .nosp{width:34px}
.sum{background:var(--sunk);border-radius:16px;padding:10px 14px;margin:6px 0 14px}
.sum-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:4px 0;font-size:14px}
.sum-row b{white-space:nowrap;font-weight:600}
.sum-row.big{font-size:18px;border-top:1px solid var(--line);margin-top:4px;padding-top:8px}
.sum-row.big b{font-family:var(--display);font-weight:500;font-size:22px}
.sum-row.fee{color:var(--accent)}
.sum-row.net b{color:var(--green)}
.colors{display:flex;flex-wrap:wrap;gap:6px}
.colors button{appearance:none;border:2px solid transparent;border-radius:50%;padding:3px;background:none;cursor:pointer;line-height:0}
.colors button[aria-pressed="true"]{border-color:var(--ink)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0 12px;font-weight:500;font-size:14.5px}
.toggle input{width:22px;height:22px;min-height:0;accent-color:var(--ink);flex:none}

/* Settings */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:14px}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.srow{appearance:none;width:100%;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 2px;border:0;border-top:1px solid var(--line);background:none;color:var(--ink);font:inherit;text-align:left;cursor:pointer}
.srow.off{opacity:.5}
.feegrid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr);gap:8px;align-items:center}
.feegrid .h{font-size:12px;color:var(--muted);font-weight:500}
.feegrid input{min-height:40px;padding:8px 10px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.tag{appearance:none;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:7px 12px;border-radius:999px;font:400 14px/1.1 var(--body);cursor:pointer}
.stack{display:flex;flex-direction:column;gap:8px}
.c-hero{display:grid;grid-template-columns:64px minmax(0,1fr);gap:14px;align-items:center;margin-bottom:12px}
.c-hero .title{margin:0 0 6px;font-size:30px;overflow-wrap:anywhere}
.c-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.note{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin-top:10px;font-size:14px;white-space:pre-wrap}
.note small{display:block;font-size:12px;color:var(--muted);margin-bottom:2px}

.toast{position:fixed;left:50%;bottom:calc(140px + env(safe-area-inset-bottom,0px));transform:translate(-50%,12px);background:var(--ink);color:var(--on-ink);padding:11px 16px;border-radius:12px;font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:80;max-width:calc(100% - 32px);width:max-content;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (min-width:960px){.toast{bottom:28px}}
/* ===== v3: refinamiento según la referencia visual ===== */
.title{font-family:var(--body);font-weight:500;font-size:28px;letter-spacing:-.012em}
h2{font-family:var(--body);font-weight:500;font-size:19px;letter-spacing:-.005em}
.big,.counter b,.pnav b,.dialog h3,.avatar.lg,.monthnav b{font-family:var(--body)}
.big{font-weight:600;font-size:38px}
.counter b{font-weight:600;font-size:21px}
.pnav b{font-weight:500;font-size:18px}
.dialog h3{font-weight:500;font-size:19px}
.sum-row.big b{font-family:var(--body);font-weight:700;font-size:20px}
.avatar{background:var(--rose-soft);color:var(--accent)}
.avatar.lg{font-weight:500;font-family:var(--serif);font-size:26px;background:var(--wine);color:var(--champ);border:1.5px solid var(--champ)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}

.top-d{display:none}
.avatar-btn{appearance:none;overflow:hidden;width:40px;height:40px;border-radius:50%;background:var(--wine);color:var(--champ);border:1.5px solid var(--champ);font:600 17px/1 var(--serif);letter-spacing:-.05em;display:grid;place-items:center;cursor:pointer;justify-self:end;padding:0}
.avatar-btn img{width:100%;height:100%;object-fit:cover;display:block}
.iconbtn.plain{border-color:transparent;background:transparent;position:relative;color:var(--champ)}
.badge{position:absolute;top:3px;right:2px;min-width:17px;height:17px;border-radius:9px;background:var(--accent);color:var(--on-accent);font:600 10.5px/17px var(--body);text-align:center;padding:0 4px}
@media (min-width:960px){

  .top-m{display:none}

  .top-r{display:flex;align-items:center;gap:10px}
  main{max-width:1040px;padding:22px 32px 60px}

/* Home */
.home-head{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.seg2{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.seg2 button{appearance:none;border:0;border-radius:10px;padding:11px 6px;font:500 15px/1 var(--body);background:var(--nude);color:var(--muted);cursor:pointer}

.kgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}

.klbl{font-size:14px;font-weight:500}

.ksub{font-size:12px;color:var(--muted);line-height:1.3}
.mini-stats{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 18px;font-size:13.5px;color:var(--muted);margin:14px 0 0}
.mini-stats b{color:var(--ink);font-weight:600}
.today{display:flex;flex-direction:column}
.reg-row{display:grid;grid-template-columns:1fr;gap:10px}

/* Appointment cards */
.acard{position:relative;display:flex;align-items:center;gap:10px;background:var(--rose-soft);border-radius:12px;padding:12px 12px 12px 22px;box-shadow:var(--shadow)}
.acard::before{content:"";position:absolute;left:9px;top:12px;bottom:12px;width:4px;border-radius:3px;background:var(--champ)}
.acard.s-confirmada{background:var(--nude)}
.acard.s-atendida{background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--accent)}

.acard.s-cancelada,.acard.s-noasistio{background:var(--sunk);opacity:.7}
.acard.s-cancelada::before,.acard.s-noasistio::before{background:var(--muted)}

.am{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;font-size:13.5px;margin-top:4px}

.tl-hours{position:relative}
.tl-hours span{position:absolute;left:0;transform:translateY(-50%);font-size:12.5px;color:var(--muted)}
.tl-grid{position:relative;cursor:copy}
.tl-line{position:absolute;left:0;right:0;height:0;border-top:1px solid var(--line)}
.tl-line.half{border-top-style:dashed;opacity:.6}
.tb{position:absolute;appearance:none;border:0;text-align:left;font:inherit;color:var(--ink);background:var(--rose-soft);border-radius:10px;padding:6px 8px 6px 16px;overflow:hidden;cursor:pointer;box-shadow:var(--shadow)}
.tb::before{content:"";position:absolute;left:6px;top:7px;bottom:7px;width:3.5px;border-radius:3px;background:var(--champ)}
.tb.s-confirmada{background:var(--nude)}
.tb.s-atendida{background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--accent)}
.tb.s-atendida::before{background:var(--accent)}
.tb b{display:block;font-weight:500;font-size:14px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb small{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.35}
.tl-now{position:absolute;left:-4px;right:0;height:2px;background:var(--accent);pointer-events:none;z-index:2}
.tl-now::before{content:"";position:absolute;left:0;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--accent)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* v4 PWA/mobile polish */
body{overscroll-behavior-y:none}
main{padding-bottom:calc(156px + env(safe-area-inset-bottom,0px))}
.top{backdrop-filter:saturate(1.05) blur(8px);-webkit-backdrop-filter:saturate(1.05) blur(8px);background:color-mix(in srgb,var(--bg) 90%,transparent)}
.nav{backdrop-filter:saturate(1.08) blur(12px);-webkit-backdrop-filter:saturate(1.08) blur(12px);background:color-mix(in srgb,var(--surface) 92%,transparent)}
.btn,.iconbtn,.nav button,.day,.row-btn,.qa{touch-action:manipulation}
@media (min-width:360px) and (max-width:599px){.reg-row{grid-template-columns:1fr 1fr}.reg-row .btn{min-height:58px;padding:10px 8px}}
@media (max-width:359px){.reg-row{grid-template-columns:1fr}}
.install-hint{padding:10px 12px;border-radius:12px;background:var(--rose-soft);color:var(--ink);font-size:13px;margin-top:10px}
.pwa-status{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--muted);margin:0 0 12px}
.pwa-dot{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px var(--green-soft)}
</style>

function applyPriceList(d){
  const t = today(); let added = 0, updated = 0;

  // retirar la plantilla antigua sin precio si nunca se usó

  PRICE_LIST.forEach(([cat, code, name, price, mins, from]) => {
    const ex = d.services.find(s => norm(s.name) === norm(name));

function migrateV1(d){

      net:r2(s.net || 0), notes:s.notes || '', createdAt:s.createdAt || Date.now()};

    return {id:e.id, date:e.date, cat:e.cat || 'Otros', desc:e.desc || '', amount:r2(e.amount), method:mm(e.method), notes:''}; });
  const sq = d.seq || {};
  n.seq = {client:sq.client || 0, sale:sq.sale || 0, appt:sq.appt || 0, exp:sq.exp || 0, srv:Math.max(sq.srv || 0, n.services.length)};
  return n;
}

function clientAgg(){
  const m = {};
  S.sales.forEach(s => { const a = m[s.clientId] = m[s.clientId] || {visits:0, total:0, last:'', first:'9999'};
    a.visits++; a.total += s.total; if (s.date > a.last) a.last = s.date; if (s.date < a.first) a.first = s.date; });
  return m;
}
function stats(from, to){
  const sales = S.sales.filter(s => s.date >= from && s.date <= to);
  const exps = S.expenses.filter(e => e.date >= from && e.date <= to);
  const bySvc = {}, byMethod = {}, byClient = {}, byCat = {};
  let svc = 0;
  sales.forEach(s => {
    const charged = s.lines.reduce((a, l) => a + l.price * l.qty, 0);
    const f = charged > 0 ? (s.total - s.fee) / charged : 0;
    s.lines.forEach(l => {
      if (!l.custom) svc += l.qty;
      const cur = l.serviceId && service(l.serviceId);
      const k = l.custom ? 'c:' + norm(l.name) : (l.serviceId || 'x:' + l.name);
      const b = bySvc[k] = bySvc[k] || {name:cur ? cur.name : l.name, color:cur ? cur.color : l.color, qty:0, rev:0, net:0, mins:0, custom:!!l.custom};
      b.qty += l.qty; b.rev += l.price * l.qty; b.net += l.price * l.qty * f; b.mins += (l.mins || 0) * l.qty;
    });
    s.payments.forEach(p => { const m = byMethod[p.method] = byMethod[p.method] || {amount:0, fee:0, count:0}; m.amount += p.amount; m.fee += p.fee; m.count++; });
    const c = byClient[s.clientId] = byClient[s.clientId] || {visits:0, total:0}; c.visits++; c.total += s.total;
  });
  exps.forEach(e => { byCat[e.cat] = (byCat[e.cat] || 0) + e.amount; });
  const agg = clientAgg();
  let nuevas = 0, recurrentes = 0;
  Object.keys(byClient).forEach(id => { if ((agg[id] || {}).first >= from) nuevas++; else recurrentes++; });
  const gross = sum(sales, 'gross'), total = sum(sales, 'total'), fee = sum(sales, 'fee'), exp = sum(exps, 'amount');
  const net = r2(total - fee), profit = r2(net - exp);
  return {sales, exps, gross, discount:r2(gross - total), total, fee, net, exp, profit,
    margin: total > 0 ? profit / total : 0, visits:sales.length, avg: sales.length ? total / sales.length : 0,
    clients:Object.keys(byClient).length, nuevas, recurrentes, svc,
    registered:S.clients.filter(c => c.created >= from && c.created <= to).length,
    bySvc, byMethod, byClient, byCat};
}

function receiptText(s){

}
function groupServices(include){
  const list = S.services.filter(s => s.active || include.includes(s.id));
  const out = [];
  S.svcCats.forEach(cat => { const l = list.filter(s => s.cat === cat).sort((a, b) => a.code.localeCompare(b.code)); if (l.length) out.push([cat, l]); });
  const other = list.filter(s => !S.svcCats.includes(s.cat));

function activeAppts(date, excl){ return S.appts.filter(a => a.date === date && a.id !== excl && ACTIVE(a)); }
function clashFor(date, time, dur, excl){
  const s = toMin(time), e = s + Math.max(dur, 1);
  return activeAppts(date, excl).find(a => { const as = toMin(a.time), ae = as + Math.max(a.dur || 0, 1); return s < ae && as < e; });
}
function freeSlots(date, dur, excl){
  if (date < today()) return [];
  const step = +S.settings.step || 30, o = toMin(S.settings.open), c = toMin(S.settings.close), d = Math.max(dur, step);
  let start = o;
  if (date === today()) start = Math.max(o, Math.ceil((toMin(nowTime()) + 1) / step) * step);
  const out = [];
  for (let m = start; m + d <= c; m += step) if (!clashFor(date, fromMin(m), d, excl)) out.push(fromMin(m));
  return out;
}

function mono(){ const w = (S.settings.name || 'Mi estudio').trim().split(/\s+/); return esc(((w[0] || '')[0] || '') + ((w[1] || '')[0] || '')).toUpperCase(); }
const fTop = F({weekday:'short', day:'numeric', month:'short', year:'numeric'});
function applyTheme(){
  const t = S.settings.theme, r = document.documentElement;
  if (t === 'light' || t === 'dark') r.dataset.theme = t; else delete r.dataset.theme;
  requestAnimationFrame(() => { const bg = getComputedStyle(document.body).backgroundColor; $('#tc').setAttribute('content', bg); });
}
function renderShell(){
  const cur = section(), name = esc(S.settings.name || 'Mi estudio');
  document.title = S.settings.name || 'Mi estudio';
  const n = alertsList().length;
  const bell = `<button class="iconbtn plain" data-act="alerts" aria-label="Avisos${n ? ', ' + n + ' pendientes' : ''}">${IC.bell}${n ? `<span class="badge">${n}</span>` : ''}</button>`;
  const av = `<button class="avatar-btn" data-act="go" data-v="config" aria-label="Configuración del estudio"><img src="${LOGO_MONO}" alt=""></button>`;
  $('#top').innerHTML = `<div class="top-m">${bell}<div class="top-name">${name}</div>${av}</div>
    <div class="top-d"><div class="top-name">${name}</div><div class="top-r"><span class="kicker">${esc(fTop.format(new Date()))}</span>${av}${bell}</div></div>`;
  const more = ['clientas','servicios','reportes','config'].includes(cur);
  const nb = (v, label, icon) => `<button data-act="go" data-v="${v}"${cur === v ? ' aria-current="page"' : ''}><span class="ico">${IC[icon]}</span>${label}</button>`;
  $('#nav').innerHTML = nb('inicio', 'Inicio', 'home') + nb('agenda', 'Agenda', 'cal')
    + `<button class="nav-add" data-act="new-appt"><span class="plus">${IC.plus}</span>Agendar</button>`
    + nb('movimientos', 'Caja', 'cash')
    + `<button data-act="more"${more ? ' aria-current="page"' : ''}><span class="ico">${IC.grid}</span>Más</button>`;
  $('#rail').innerHTML = `<img class="rail-logo" src="${LOGO_FULL}" alt="${name}">
    <button class="rl rl-search" data-act="search">${IC.search}Buscar clienta</button>
    ${SECTIONS.map(s => `<button class="rl" data-act="go" data-v="${s.id}"${cur === s.id ? ' aria-current="page"' : ''}>${IC[s.icon]}${s.label}</button>`).join('')}`;
}
function alertsList(){
  const t = today(), out = [];
  const past = S.appts.filter(a => ACTIVE(a) && a.date < t).sort(byDTasc);
  if (past.length) out.push({icon:'clock', title:`${plural(past.length, 'cita de días anteriores sin cerrar', 'citas de días anteriores sin cerrar')}`, text:'Cóbralas o márcalas como canceladas o no asistió.', btns:`<button class="btn sm" data-act="agenda-go" data-d="${past[0].date}">Revisar</button>`});
  if (!S.services.length) out.push({icon:'bottle', title:'Crea tu catálogo de servicios', text:'Cada reserva y venta toma de aquí el nombre, el precio y la duración.', btns:`<button class="btn sm primary" data-act="new-service">Crear servicio</button><button class="btn sm" data-act="load-catalog">Cargar mi lista de precios</button>`});
  else { const np = S.services.filter(s => s.active && !(+s.price > 0)).length;
    if (np) out.push({icon:'alert', title:plural(np, 'servicio sin precio', 'servicios sin precio'), text:'Ponles precio antes de cobrar.', btns:`<button class="btn sm" data-act="go" data-v="servicios">Ir a servicios</button>`}); }
  if ((S.sales.length || S.clients.length) && (!S.settings.lastBackup || daysBetween(S.settings.lastBackup, t) >= 7))
    out.push({icon:'down', title:S.settings.lastBackup ? `Tu último respaldo tiene ${plural(daysBetween(S.settings.lastBackup, t), 'día', 'días')}` : 'Aún no tienes un respaldo', text:'Los datos viven en este navegador. Un respaldo te permite recuperarlos en otro equipo.', btns:`<button class="btn sm" data-act="export-json">Descargar respaldo</button>`});
  S.clients.filter(c => c.birthday && c.birthday.slice(5) === t.slice(5)).forEach(c => out.push({icon:'users', title:`Hoy cumple ${esc(c.name)}`, text:esc(c.id),
    btns:c.phone ? `<a class="btn sm" href="${esc(waLink(c.phone, `¡Feliz cumpleaños, ${c.name.split(' ')[0]}! Te saluda todo el equipo de ${S.settings.name}.`))}" target="_blank" rel="noopener">${IC.wa}Saludar</a>` : ''}));
  return out;
}
const alertHTML = a => `<div class="alert">${IC[a.icon]}<div><b>${a.title}</b><p>${a.text}</p>${a.btns ? `<div class="row">${a.btns}</div>` : ''}</div></div>`;
function render(top){
  renderShell();
  $('#main').innerHTML = VIEWS[ui.view]();
  if (ui.view === 'clientas') renderClientList();
  if (top) window.scrollTo(0, 0);
}

/* ---------- Components ---------- */
function apptCard(a, showDate){
  const c = client(a.clientId), svs = a.services.map(service).filter(Boolean);
  const st = STATUS[a.status] || STATUS.pendiente, sale = a.saleId && findSale(a.saleId);
  const t = today(), due = a.date < t || (a.date === t && toMin(a.time) <= toMin(nowTime()) + 15);
  let btn = '';
  if (ACTIVE(a)) btn = (a.status === 'confirmada' || due) ? `<button class="btn sm primary" data-act="appt-charge" data-id="${a.id}">Cobrar</button>` : `<button class="btn sm" data-act="appt-confirm" data-id="${a.id}">Confirmar</button>`;

  const e = m.ref;

    <span class="minfo"><span class="rtitle">${esc(e.desc || e.cat)}</span><span class="rsub"><span class="ell">${esc(e.desc ? e.cat + ', ' : '')}${esc(methodLabel(e.method))}</span></span></span>
    <span class="ramt neg-t">−${money(e.amount)}</span></button>`;
}
function movements(from, to){
  const rows = [];
  S.sales.forEach(s => { if (s.date < from || s.date > to) return;
    rows.push({type:'venta', date:s.date, time:s.time, amount:s.total, ref:s});
    if (s.fee > 0) rows.push({type:'comision', date:s.date, time:s.time, amount:-s.fee, ref:s}); });
  S.expenses.forEach(e => { if (e.date >= from && e.date <= to) rows.push({type:'gasto', date:e.date, time:'', amount:-e.amount, ref:e}); });
  return rows.sort((a, b) => byDTdesc(a, b) || (a.type === 'venta' ? -1 : 1));
}
function delta(cur, prev, invert){
  if (!prev && !cur) return '';
  if (!prev) return `<span class="delta">Sin datos del período anterior</span>`;
  const ch = (cur - prev) / Math.abs(prev), good = invert ? ch < 0 : ch > 0;
  if (Math.abs(ch) < 0.005) return `<span class="delta">Igual que el período anterior</span>`;
  return `<span class="delta ${good ? 'up' : 'down'}">${ch > 0 ? '+' : '−'}${Math.round(Math.abs(ch) * 100)}% vs. período anterior</span>`;
}

const HOUR = 72;
function timelineHTML(date){
  const items = S.appts.filter(a => a.date === date && a.status !== 'cancelada' && a.status !== 'noasistio').sort((a, b) => a.time.localeCompare(b.time));
  let start = toMin(S.settings.open), end = toMin(S.settings.close);
  items.forEach(a => { start = Math.min(start, toMin(a.time)); end = Math.max(end, toMin(a.time) + (a.dur || 0)); });
  start = Math.floor(start / 60) * 60; end = Math.min(24 * 60, Math.ceil(end / 60) * 60);
  const px = m => (m - start) * HOUR / 60, H = px(end);
  let hours = '', lines = '';
  for (let m = start; m <= end; m += 60) {
    hours += `<span style="top:${px(m)}px">${fromMin(m % 1440)}</span>`;
    lines += `<div class="tl-line" style="top:${px(m)}px"></div>`;
    if (m + 30 < end) lines += `<div class="tl-line half" style="top:${px(m + 30)}px"></div>`;
  }
  // lanes for overlapping bookings
  const placed = []; let cluster = [], clusterEnd = -1;
  const flush = () => { const lanes = []; cluster.forEach(p => { let l = lanes.findIndex(e => e <= p.s); if (l < 0) { l = lanes.length; lanes.push(0); } lanes[l] = p.e; p.lane = l; }); cluster.forEach(p => { p.n = lanes.length; placed.push(p); }); cluster = []; };
  items.forEach(a => { const s = toMin(a.time), e = s + Math.max(a.dur || 0, 15); if (s >= clusterEnd && cluster.length) flush(); cluster.push({a, s, e}); clusterEnd = Math.max(clusterEnd, e); });
  if (cluster.length) flush();
  const blocks = placed.map(p => { const a = p.a, c = client(a.clientId), svs = a.services.map(service).filter(Boolean), st = STATUS[a.status] || STATUS.pendiente;
    const h = Math.max(px(p.e) - px(p.s) - 4, 40);
    return `<button class="tb s-${a.status}" data-act="appt-open" data-id="${a.id}" style="top:${px(p.s) + 2}px;height:${h}px;left:calc(${p.lane / p.n * 100}% + 2px);width:calc(${100 / p.n}% - 4px)">
      <b>${esc(c ? c.name : 'Clienta eliminada')}</b><small>${esc(a.time)}–${fromMin(p.e % 1440)} • ${st.label}</small>${h > 62 ? `<small>${esc(svs.map(s => s.name).join(', '))}</small>` : ''}</button>`; }).join('');
  let now = '';
  if (date === today()) { const m = toMin(nowTime()); if (m >= start && m <= end) now = `<div class="tl-now" style="top:${px(m)}px"></div>`; }
  return `<div class="tl" style="height:${H}px"><div class="tl-hours">${hours}</div>
    <div class="tl-grid" data-act="tl-tap" data-start="${start}" style="height:${H}px">${lines}${now}${blocks}</div></div>`;
}

  o += Object.keys(g).map(d => { const net = sum(g[d], 'amount');
    return `<h3 class="dgroup"><span>${cap(fLong.format(pd(d)))}</span><span class="${net < 0 ? 'neg-t' : ''}">${net < 0 ? '−' : ''}${money(Math.abs(net))}</span></h3><div class="list">${g[d].map(moveRow).join('')}</div>`; }).join('');
  return o;
};

/* ---------- Reports ---------- */
function rRange(off){
  const t = today(); off = off === undefined ? ui.rOff : off;
  switch (ui.rp) {
    case 'hoy': { const d = addDays(t, off); return [d, d]; }
    case 'semana': { const w = addDays(weekStart(t), 7 * off); return [w, addDays(w, 6)]; }
    case 'anio': { const y = +t.slice(0, 4) + off; return [y + '-01-01', y + '-12-31']; }
    case 'rango': { let [a, b] = ui.rFrom <= ui.rTo ? [ui.rFrom, ui.rTo] : [ui.rTo, ui.rFrom];
      if (off) { const len = daysBetween(a, b) + 1; a = addDays(a, len * off); b = addDays(b, len * off); } return [a, b]; }
    default: return monthRange(shiftMonth(t.slice(0, 7), off));
  }
}
function rLabel(a, b){
  if (ui.rp === 'hoy') return cap(fLong.format(pd(a)));
  if (ui.rp === 'mes') return cap(fMonth.format(pd(a)));
  if (ui.rp === 'anio') return a.slice(0, 4);
  return `${fDM.format(pd(a))} al ${fDM.format(pd(b))} ${b.slice(0, 4)}`;
}
function chartSVG(from, to){
  const n = daysBetween(from, to) + 1;
  if (n < 2) return '';
  const b = [];
  if (n <= 31) for (let i = 0; i < n; i++) { const d = addDays(from, i); b.push({f:d, t:d, l:String(pd(d).getDate())}); }
  else { let ym = from.slice(0, 7); while (ym <= to.slice(0, 7)) { const [mf, mt] = monthRange(ym); b.push({f:mf < from ? from : mf, t:mt > to ? to : mt, l:fMonS.format(pd(mf)).replace('.', '')}); ym = shiftMonth(ym, 1); } }
  b.forEach(x => {
    x.inc = S.sales.filter(s => s.date >= x.f && s.date <= x.t).reduce((a, s) => a + s.total - s.fee, 0);
    x.ex = S.expenses.filter(e => e.date >= x.f && e.date <= x.t).reduce((a, e) => a + e.amount, 0);
    x.p = x.inc - x.ex;
  });
  if (!b.some(x => x.inc || x.ex)) return '';
  const hi = Math.max(1, ...b.map(x => Math.max(x.inc, x.ex, x.p))), lo = Math.min(0, ...b.map(x => x.p));
  const W = 320, top = 8, bot = 116, Y = v => bot - (v - lo) / (hi - lo) * (bot - top), y0 = Y(0);
  const gw = W / b.length, bw = Math.max(1.5, Math.min(11, gw * 0.34)), every = b.length > 16 ? 5 : b.length > 10 ? 2 : 1;
  let bars = '', lbl = '', pts = [];
  b.forEach((x, i) => {
    const cx = i * gw + gw / 2;
    if (x.inc > 0) bars += `<rect class="b-in" x="${(cx - bw - .6).toFixed(1)}" y="${Y(x.inc).toFixed(1)}" width="${bw.toFixed(1)}" height="${(y0 - Y(x.inc)).toFixed(1)}" rx="1.5"><title>${esc(x.l)}: ingreso neto ${esc(moneyTxt(x.inc))}</title></rect>`;
    if (x.ex > 0) bars += `<rect class="b-ex" x="${(cx + .6).toFixed(1)}" y="${Y(x.ex).toFixed(1)}" width="${bw.toFixed(1)}" height="${(y0 - Y(x.ex)).toFixed(1)}" rx="1.5"><title>${esc(x.l)}: gastos ${esc(moneyTxt(x.ex))}</title></rect>`;
    pts.push(`${cx.toFixed(1)},${Y(x.p).toFixed(1)}`);
    if (i % every === 0 || i === b.length - 1) lbl += `<text class="c-lbl" x="${cx.toFixed(1)}" y="${bot + 15}" text-anchor="middle">${esc(x.l)}</text>`;
  });
  return `<div class="chart"><svg viewBox="0 0 ${W} 136" role="img" aria-label="Evolución de ingresos netos, gastos y ganancia"><line class="c-axis" x1="0" x2="${W}" y1="${y0.toFixed(1)}" y2="${y0.toFixed(1)}"/>${bars}<polyline class="c-line" points="${pts.join(' ')}"/>${lbl}</svg>
    <div class="legend"><span><i style="background:var(--ink)"></i>Ingreso neto</span><span><i style="background:var(--champ)"></i>Gastos</span><span><i style="background:var(--accent);height:2px;vertical-align:3px"></i>Ganancia</span></div></div>`;
}

  const top5 = Object.keys(st.byClient).sort((a, b) => st.byClient[b].total - st.byClient[a].total).slice(0, 5);

    return `<button class="row-btn r3" data-act="open-client" data-id="${esc(id)}"><span class="avatar">${esc(initials(c ? c.name : '?'))}</span><span class="minfo"><span class="rtitle">${esc(c ? c.name : 'Clienta eliminada')}</span><span class="rsub"><span class="idtag">${esc(id)}</span>${plural(x.visits, 'visita', 'visitas')}</span></span><span class="ramt">${money(x.total)}</span></button>`; }).join('')}</div>`;
  // Servicios
  const svcs = Object.values(st.bySvc).filter(s => !s.custom);
  o += `<div class="sec-head"><h2>Servicios</h2></div>

    o += `<div class="bars">${r.map(s => `<div class="brow acc"><span class="bname">${sw(s.color)}<span>${esc(s.name)}</span></span><span class="bq">neto ${money(s.net)}</span><span class="bamt">${s.mins ? money(s.ph) + '/h' : '—'}</span><i style="--w:${(s.ph / mx * 100).toFixed(1)}%"></i></div>`).join('')}</div>

  o += `<div style="margin-top:24px"><button class="btn block" data-act="export-csv">${IC.down}Exportar movimientos del período (.csv)</button></div>`;
  return o;
};

let sheetEl = null;
function removeSheet(){ if (sheetEl) { sheetEl.remove(); sheetEl = null; document.body.style.overflow = ''; } }
function closeSheet(){ removeSheet(); draft = null; }
function openSheet(title, body, foot){
  removeSheet();

  d.className = 'scrim';
  d.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-t"><div class="sheet-head"><h2 id="sh-t">${esc(title)}</h2><button class="iconbtn" data-act="sheet-close" aria-label="Cerrar">${IC.x}</button></div><div class="sheet-body">${body}</div>${foot ? `<div class="sheet-foot">${foot}</div>` : ''}</div>`;
  d.addEventListener('click', ev => { if (ev.target === d) closeSheet(); });
  document.body.appendChild(d);
  document.body.style.overflow = 'hidden';
  requestAnimationFrame(() => d.classList.add('open'));
  sheetEl = d;
}

function apDur(){ return draft.services.reduce((x, id) => x + ((service(id) || {}).mins || 0), 0); }
function updAppt(){

function saveAppt(){

  if (cl && !draft.force) { draft.force = true; $('#ap-save').textContent = 'Guardar aunque se cruce'; toast('Hay un cruce de horario. Toca de nuevo para guardar igual.'); return; }
  const cid = resolveClient(); if (!cid) return;

  openSheet(ex ? `Editar venta ${ex.id}` : ap ? `Cobrar reserva ${ap.id}` : 'Registrar ingreso', body, `<button class="btn primary block" id="sl-save" data-act="sl-save">Cobrar</button>`);

function renderPay(){
  const el = $('#sl-pay');
  if (!draft.split) {
    el.innerHTML = `<div class="mchips">${METHODS.map(m => { const fl = feeLabel(m.id);
      return `<button type="button" class="mchip" data-act="sl-method" data-m="${m.id}" aria-pressed="${draft.payments[0].method === m.id}">${esc(m.short)}${fl ? `<small>${esc(fl.replace(' + IGV', '+IGV'))}</small>` : ''}</button>`; }).join('')}</div>
      <button type="button" class="linkbtn" data-act="sl-split">Dividir el pago entre varios métodos</button>`;
    return;
  }
  const n = draft.payments.length;
  el.innerHTML = draft.payments.map((p, i) => `<div class="prow"><select class="psel" data-i="${i}" aria-label="Método ${i + 1}">${METHODS.map(m => `<option value="${m.id}"${p.method === m.id ? ' selected' : ''}>${esc(m.label)}</option>`).join('')}</select>
      ${i < n - 1 ? `<input class="pamt" data-i="${i}" type="number" inputmode="decimal" min="0" step="0.10" placeholder="0.00" value="${p.amount === '' ? '' : p.amount}" aria-label="Monto ${i + 1}">` : `<output id="pay-rest" aria-label="Resto"></output>`}
      ${n > 2 ? `<button type="button" class="iconbtn sm" data-act="sl-del-pay" data-i="${i}" aria-label="Quitar método">${IC.x}</button>` : '<span class="nosp"></span>'}</div>`).join('')
    + `<p class="hint" style="margin:0">El último método toma automáticamente el resto.</p><div class="actions" style="margin-top:6px">${n < 4 ? '<button type="button" class="btn sm" data-act="sl-add-pay">Agregar método</button>' : ''}<button type="button" class="btn sm ghost" data-act="sl-single">Un solo método</button></div>`;
}
function saleCalc(){
  const lines = draft.lines.filter(l => l.qty > 0);
  const gross = r2(lines.reduce((a, l) => a + Math.max(l.list, l.price) * l.qty, 0));
  const sub = r2(lines.reduce((a, l) => a + l.price * l.qty, 0));
  const disc = r2(Math.min(sub, Math.max(0, +draft.disc || 0)));
  const total = r2(sub - disc);
  let pays;
  if (!draft.split) pays = [{method:draft.payments[0].method, amount:total}];
  else { pays = draft.payments.map(p => ({method:p.method, amount:r2(+p.amount || 0)}));
    pays[pays.length - 1].amount = r2(total - pays.slice(0, -1).reduce((a, p) => a + p.amount, 0)); }
  pays.forEach(p => { p.fee = feeFor(p.amount, p.method); });
  const fee = r2(pays.reduce((a, p) => a + p.fee, 0));
  return {lines, gross, sub, disc, total, discount:r2(gross - total), pays, fee, net:r2(total - fee), count:lines.reduce((a, l) => a + l.qty, 0)};
}
function updSale(){
  const c = saleCalc();
  let h = '';
  if (c.gross !== c.sub) h += `<div class="sum-row"><span>Precio de lista</span><b>${money(c.gross)}</b></div><div class="sum-row"><span>Ajustes de precio</span><b>−${money(c.gross - c.sub)}</b></div>`;
  if (c.disc) h += `<div class="sum-row"><span>Descuento adicional</span><b>−${money(c.disc)}</b></div>`;
  h += `<div class="sum-row big"><span>Total a cobrar</span><b>${money(c.total)}</b></div>`;
  if (draft.split) c.pays.forEach(p => { h += `<div class="sum-row"><span>${esc(methodLabel(p.method))}</span><b>${money(p.amount)}</b></div>`; });
  c.pays.filter(p => p.fee).forEach(p => { h += `<div class="sum-row fee"><span>Comisión ${esc(methodLabel(p.method).replace('Tarjeta de ', ''))} (${esc(feeLabel(p.method))})</span><b>−${money(p.fee)}</b></div>`; });
  h += `<div class="sum-row net"><span>Ingreso neto</span><b>${money(c.net)}</b></div>`;
  $('#sl-sum').innerHTML = h;
  const rest = $('#pay-rest');
  if (rest) { const last = c.pays[c.pays.length - 1]; rest.textContent = moneyTxt(last.amount); rest.classList.toggle('neg-t', last.amount < 0); }
  $('#sl-save').textContent = c.count ? `Cobrar ${moneyTxt(c.total)}` : 'Cobrar';
}
function saveSale(){
  const c = saleCalc();
  if (!c.count) { toast('Agrega al menos un servicio o cargo'); return; }
  if (c.lines.some(l => l.custom && !(l.price > 0))) { toast('Pon el monto del cargo libre o quítalo'); return; }
  if (draft.split && c.total > 0 && c.pays.some(p => !(p.amount > 0))) { toast('Cada método del pago dividido debe tener un monto mayor a cero'); return; }
  const date = $('#sl-date').value || today(), time = $('#sl-time').value || nowTime();
  const cid = resolveClient(); if (!cid) return;
  const lines = c.lines.map(l => ({serviceId:l.custom ? null : (l.serviceId || null), code:l.code || '', name:l.custom ? (l.name.trim() || 'Cargo adicional') : l.name,
    cat:l.cat || '', color:l.custom ? '#C4AA80' : l.color, mins:l.mins || 0, list:r2(l.custom ? l.price : l.list), price:r2(l.price), qty:l.qty, custom:!!l.custom}));
  const rec = {clientId:cid, date, time, apptId:draft.apptId, lines, gross:c.gross, extraDisc:c.disc, discount:c.discount, total:c.total,
    payments:c.pays.map(p => ({method:p.method, amount:p.amount, fee:p.fee})), fee:c.fee, net:c.net, notes:$('#sl-notes').value.trim()};
  const sid = draft.id || nextId('sale', 'V-', 5), editing = !!draft.id;
  if (editing) Object.assign(findSale(sid), rec); else S.sales.push(Object.assign({id:sid, createdAt:Date.now()}, rec));
  if (draft.apptId) { const a = findAppt(draft.apptId); if (a) { a.status = 'atendida'; a.saleId = sid; } }
  save(); closeSheet(); render();
  toast(editing ? 'Venta actualizada' : `Venta ${sid}: ${moneyTxt(c.total)}${c.fee ? ', neto ' + moneyTxt(c.net) : ''}`);

/* ---------- Backup & CSV ---------- */
async function saveFile(name, content){
  try {
    if (window.claude && typeof window.claude.use === 'function') {
      const d = await window.claude.use('downloads');
      if (d) { await d.save({filename:name, data:content}); return true; }
    }
  } catch (err) {
    if (err && err.code === 'declined') return false;
    if (err && err.code === 'rate_limited') { toast('Espera un momento e inténtalo de nuevo'); return false; }
  }
  try {
    const blob = new Blob([content], {type:name.endsWith('.csv') ? 'text/csv;charset=utf-8' : 'application/json'});
    const url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url; a.download = name; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1500);
    return true;
  } catch (e) { toast('No se pudo generar el archivo en este navegador'); return false; }
}
const csvCell = v => { const s = String(v ?? ''); return /[",\n;]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
function exportCSV(from, to){
  const head = ['tipo','id','referencia','fecha','hora','clienta_id','clienta','detalle','metodo','importe'];
  const rows = movements(from, to).reverse().map(m => {
    if (m.type === 'gasto') { const e = m.ref; return ['gasto', e.id, '', e.date, '', '', '', e.cat + (e.desc ? ': ' + e.desc : ''), methodLabel(e.method), (-e.amount).toFixed(2)]; }
    const s = m.ref, c = client(s.clientId);
    if (m.type === 'comision') return ['comision_pos', s.id + '-C', s.id, s.date, s.time, s.clientId, c ? c.name : '', s.payments.filter(p => p.fee).map(p => methodLabel(p.method) + ' ' + p.fee.toFixed(2)).join(' / '), '', (-s.fee).toFixed(2)];
    return ['venta', s.id, s.apptId || '', s.date, s.time, s.clientId, c ? c.name : '', s.lines.map(l => `${l.code ? l.code + ' ' : ''}${l.name} x${l.qty} @${l.price.toFixed(2)}`).join(' | ') + (s.extraDisc ? ` | descuento ${s.extraDisc.toFixed(2)}` : ''), s.payments.map(p => methodLabel(p.method) + ' ' + p.amount.toFixed(2)).join(' / '), s.total.toFixed(2)];
  });
  saveFile(`movimientos-${from}-a-${to}.csv`, '\ufeff' + [head].concat(rows).map(r => r.map(csvCell).join(',')).join('\r\n'));
}

    const t = today();
    BASE_CATALOG.forEach(x => { if (S.services.some(s => s.code === x[0])) return; if (!S.svcCats.includes(x[2])) S.svcCats.push(x[2]);
      S.services.push({id:'srv' + (++S.seq.srv), code:x[0], name:x[1], cat:x[2], price:0, mins:x[3], color:x[4], active:true, history:[{from:t, price:0}]}); });
    save(); ui.view = 'servicios'; render(true); toast('Catálogo base cargado. Ponle precio a cada servicio.'); },

  'r-off'(el){ ui.rOff += +el.dataset.n; render(); },
  rp(el){ ui.rp = el.dataset.p; ui.rOff = 0; render(); },
  'r-svc'(el){ ui.rSvc = el.dataset.s; render(); },
  'export-csv'(){ const [f, t] = rRange(); exportCSV(f, t); },
  'export-all-csv'(){ const d = S.sales.map(s => s.date).concat(S.expenses.map(e => e.date)).sort(); if (!d.length) { toast('Aún no hay movimientos'); return; } exportCSV(d[0], d[d.length - 1]); },
  async 'export-json'(){
    const ok = await saveFile(`respaldo-${norm(S.settings.name).replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '')}-${today()}.json`, JSON.stringify(S, null, 1));
    if (ok) { S.settings.lastBackup = today(); save(); render(); toast('Respaldo descargado'); } },
  'import-json'(){ $('#imp').click(); },
  reset(){ askConfirm('Borrar todos los datos', 'Se eliminarán clientas, reservas, ventas, gastos y servicios de este dispositivo. Descarga un respaldo antes si lo necesitas.', 'Borrar todo', () => {
    S = normalize(defaultState()); save(); applyTheme(); ui.view = 'inicio'; render(true); toast('Datos borrados'); }); },
  theme(el){ S.settings.theme = el.dataset.t; save(); applyTheme(); render(); },
  'new-cat'(el){ catSheet(el.dataset.k, null); },
  'edit-cat'(el){ catSheet(el.dataset.k, el.dataset.n); },
  'k-save'(){ const name = $('#k-name').value.trim(); if (!name) { toast('Escribe un nombre'); return; }
    const list = draft.k === 'svc' ? S.svcCats : S.expCats;
    if (list.some(c => norm(c) === norm(name) && c !== draft.name)) { toast('Esa categoría ya existe'); return; }
    if (draft.name) { list[list.indexOf(draft.name)] = name;
      if (draft.k === 'svc') S.services.forEach(s => { if (s.cat === draft.name) s.cat = name; });
      else S.expenses.forEach(e => { if (e.cat === draft.name) e.cat = name; }); }
    else list.push(name);
    save(); closeSheet(); render(); toast('Categoría guardada'); },
  'k-del'(){ const k = draft.k, n = draft.name, list = k === 'svc' ? S.svcCats : S.expCats;
    const used = k === 'svc' ? S.services.some(s => s.cat === n) : S.expenses.some(e => e.cat === n);
    if (used) { toast('Está en uso. Renómbrala o cambia primero los registros que la usan.'); return; }
    if (list.length <= 1) { toast('Debe quedar al menos una categoría'); return; }
    list.splice(list.indexOf(n), 1); save(); closeSheet(); render(); toast('Categoría eliminada'); },
  'sheet-close'(){ closeSheet(); }
};

/* ---------- Events ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const f = A[el.dataset.act];
  if (f) { e.preventDefault(); f(el, e); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'cq') { ui.q = t.value; renderClientList(); return; }
  if (t.id === 'cp-q') { draft.cpq = t.value; renderPickerList(); return; }
  if (t.id === 'sl-q' && draft) { draft.sq = t.value; renderItems(); return; }
  if (t.id === 'ap-q') { const q = norm(t.value).trim();
    $$('.svc-grp').forEach(g => { let any = false; g.querySelectorAll('.svc-chip').forEach(c => { const show = !q || c.dataset.q.includes(q) || c.getAttribute('aria-pressed') === 'true'; c.hidden = !show; any = any || show; }); g.hidden = !any; }); return; }
  if (!draft) return;
  if (draft.kind === 'appt' && (t.id === 'ap-time' || t.id === 'ap-date')) updAppt();
  if (draft.kind === 'sale') {
    if (t.id === 'sl-disc') { draft.disc = t.value; updSale(); }
    else if (t.classList.contains('pin')) { const l = draft.lines.find(x => x.key === t.dataset.key); if (l) { l.price = Math.max(0, parseFloat(t.value) || 0); if (l.custom) l.list = l.price; updSale(); } }
    else if (t.classList.contains('cin')) { const l = draft.lines.find(x => x.key === t.dataset.key); if (l) l.name = t.value; }
    else if (t.classList.contains('pamt')) { draft.payments[+t.dataset.i].amount = t.value; updSale(); }
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.classList.contains('psel') && draft) { draft.payments[+t.dataset.i].method = t.value; updSale(); return; }
  if (t.id === 'r-from' || t.id === 'r-to') { if (t.value) { ui[t.id === 'r-from' ? 'rFrom' : 'rTo'] = t.value; render(); } return; }
  if (t.dataset.set) {
    const path = t.dataset.set.split('.'), last = path[path.length - 1];
    let o = S; for (let i = 0; i < path.length - 1; i++) o = o[path[i]];
    let v = t.type === 'checkbox' ? t.checked : t.hasAttribute('data-num') ? Math.max(0, parseFloat(t.value) || 0) : t.value.trim();
    if (last === 'name' && !v) v = 'Mi estudio';
    if (last === 'currency' && !v) v = 'S/';
    if ((last === 'open' || last === 'close') && !v) v = last === 'open' ? '09:00' : '20:00';
    if (last === 'step' && !v) v = 30;
    o[last] = v;
    if (S.settings.open >= S.settings.close) toast('La hora de cierre debe ser posterior a la de apertura');
    save(); renderShell();
    const ex = $('#fee-ex'); if (ex) ex.innerHTML = feeExample();
    toast('Guardado');
  }
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  const dlg = document.querySelector('.scrim.center'); if (dlg) { dlg.remove(); return; }
  if (sheetEl) closeSheet();
});
$('#imp').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (!d || !Array.isArray(d.clients) || !Array.isArray(d.sales) || !Array.isArray(d.services)) throw new Error('formato');
      const data = d.v === 2 ? normalize(d) : migrateV1(d);
      askConfirm('Restaurar respaldo', `El archivo tiene ${plural(data.clients.length, 'clienta', 'clientas')}, ${plural(data.sales.length, 'venta', 'ventas')} y ${plural(data.expenses.length, 'gasto', 'gastos')}. Reemplazará los datos actuales.`, 'Restaurar', () => {
        S = data; save(); applyTheme(); ui.view = 'inicio'; render(true); toast('Respaldo restaurado'); });
    } catch (err) { toast('Ese archivo no es un respaldo de esta app'); }
    e.target.value = '';
  };
  r.readAsText(f);
});
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);

window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredInstallPrompt = e;
  if (ui.view === 'config') render(); else renderShell();
});
window.addEventListener('appinstalled', () => {
  deferredInstallPrompt = null;
  toast('Sarahi Nails quedó instalada');
  renderShell();
});
if ('serviceWorker' in navigator && window.isSecureContext) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').then(reg => {
      reg.addEventListener('updatefound', () => {
        const w = reg.installing;
        if (!w) return;
        w.addEventListener('statechange', () => {
          if (w.state === 'installed' && navigator.serviceWorker.controller) toast('Nueva versión lista. Recarga la app.');
        });
      });
    }).catch(() => {});
  });
}
let lastDay = today();
setInterval(() => { if (today() !== lastDay) { lastDay = today(); if (!sheetEl) render(); } }, 60000);

applyTheme();
render();
})();
</script>
</body></html>
